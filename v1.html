<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Positions ETS1</title>
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
<style>
:root{--ink:#1d2433;--mute:#667085;--line:#d9dde6;--bg:#f5f6f9;--card:#fff}
*{box-sizing:border-box}
body{margin:0;padding:12px;font:14px/1.4 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
button,select,input{border:1px solid var(--line);border-radius:6px;background:#fff;padding:6px 10px}
button{cursor:pointer}button:hover{background:#eef0f5}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar .sp{flex:1}
#addbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;margin-bottom:10px;background:#fff;border:1px solid var(--line);border-radius:6px}
#addbox[hidden],#drawer[hidden]{display:none}
.msg{color:var(--mute);padding:24px;text-align:center}
.dash{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.bar{display:flex;height:34px;border-radius:4px;overflow:hidden;background:#eee}
.seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.seg.ni{background:repeating-linear-gradient(45deg,#e3e6ec,#e3e6ec 6px,#f0f2f6 6px,#f0f2f6 12px);color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.camps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.camp{border:1px solid var(--line);border-left-width:5px;border-radius:6px;padding:8px 10px}
.camp b{display:block}
.tag{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.tag.qm{background:#fde4e1;color:#9a1b10}.tag.bl{background:#fff0d6;color:#8a5200}.tag.no{background:#eceef3;color:var(--mute)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(180px,1fr);gap:10px;overflow-x:auto;align-items:start}
.col{background:#eceef3;border-top:4px solid var(--c);border-radius:6px;min-height:160px;padding:8px}
.col.over{outline:2px dashed var(--c);background:#e3e6ee}
.col h3{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.col h3 span{color:var(--mute);font-weight:400;white-space:nowrap}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-bottom:6px;cursor:grab;display:flex;justify-content:space-between;gap:6px}
.card:hover{border-color:var(--ink)}
.card small{color:var(--mute)}
.card .n{color:#b7791f}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-4px 0 16px rgba(0,0,0,.12);padding:16px;overflow:auto;z-index:5}
#drawer label{display:block;margin:12px 0 4px;font-weight:600}
#drawer select,#drawer input,#drawer textarea{width:100%}
#drawer textarea{min-height:140px;border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
#drawer h2{margin:0;font-size:18px}
#drawer .top{display:flex;justify-content:space-between;align-items:start;gap:8px}
:focus-visible{outline:2px solid #2b59c3;outline-offset:1px}
@media(max-width:700px){.camps{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<div id="addbox" hidden>
  <input id="addTheme" list="themeList" placeholder="Thème">
  <datalist id="themeList"></datalist>
  <input id="addSous" placeholder="Nom du sous-thème">
  <button id="addOk" class="on">Créer le sous-thème</button>
  <button id="addCancel">Annuler</button>
  <span id="addMsg" class="msg" style="padding:0"></span>
</div>
<div id="dash"></div>
<div id="board"></div>
<aside id="drawer" hidden></aside>

<script>
// ---------- Paramètres (à adapter si besoin) ----------
const POS = [
  {k:'Beaucoup moins ambitieux', c:'#9a1b10', g:'moins'},
  {k:'Moins ambitieux',          c:'#d9603b', g:'moins'},
  {k:'Commission',               c:'#6b7280', g:'centre'},
  {k:'Plus ambitieux',           c:'#3f9a6d', g:'plus'},
  {k:'Beaucoup plus ambitieux',  c:'#0c5c3c', g:'plus'}
];
const NI = {k:'Non identifié', c:'#aab1bf', g:'ni'};
const SEUILS = {blocageEtats:4, blocagePop:35, qmEtats:15, qmPop:65};

// ---------- État ----------
let rows = [], theme = '', sous = '', mode5 = true, openId = null, TOTAL = 0;
const norm = s => (s == null ? '' : String(s)).trim().toLowerCase();
const posKey = r => (POS.find(p => norm(p.k) === norm(r.position)) || NI).k;
const fmt = x => x.toFixed(1).replace('.', ',');
const pct = r => TOTAL ? (Number(r.poids) || 0) / TOTAL * 100 : 0;
const uniq = a => [...new Set(a.filter(Boolean))];
const h = (t, a = {}, ...c) => {
  const e = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  e.append(...c.flat().filter(x => x != null && x !== false));
  return e;
};

// ---------- Connexion à Grist ----------
grist.ready({
  requiredAccess: 'full',
  columns: [
    {name:'code',      title:'Code État membre', type:'Text'},
    {name:'etat',      title:'État membre',      type:'Text'},
    {name:'poids',     title:'Poids (%)',        type:'Numeric'},
    {name:'theme',     title:'Thème',            type:'Text'},
    {name:'sousTheme', title:'Sous-thème',       type:'Text'},
    {name:'position',  title:'Position',         type:'Text,Choice'},
    {name:'notes',     title:'Notes',            type:'Text', optional:true},
    {name:'source',    title:'Source',           type:'Text', optional:true}
  ]
});
grist.onRecords(recs => {
  rows = grist.mapColumnNames(recs) || [];
  const byCode = {};
  rows.forEach(r => { if (r.code && !(r.code in byCode)) byCode[r.code] = Number(r.poids) || 0; });
  TOTAL = Object.values(byCode).reduce((a, b) => a + b, 0);
  render();
  if (openId != null && !document.activeElement.closest('#drawer')) renderDrawer();
});

function save(id, fields) {
  const r = rows.find(x => x.id === id);
  if (r) Object.assign(r, fields);
  return grist.selectedTable.update({id, fields: grist.mapColumnNamesBack(fields)});
}

// ---------- Calculs ----------
function current() { return rows.filter(r => r.theme === theme && r.sousTheme === sous); }
function stats(cur) {
  const s = {};
  [...POS, NI].forEach(p => s[p.k] = {n:0, pop:0});
  cur.forEach(r => { const x = s[posKey(r)]; x.n++; x.pop += pct(r); });
  return s;
}
function statut(n, p) {
  if (n >= SEUILS.qmEtats && p >= SEUILS.qmPop) return ['Majorité qualifiée atteinte', 'qm'];
  if (n >= SEUILS.blocageEtats && p >= SEUILS.blocagePop) return ['Minorité de blocage', 'bl'];
  return ['Ni majorité qualifiée ni minorité de blocage', 'no'];
}

// ---------- Rendu ----------
function render() {
  const tb = document.getElementById('toolbar'), dash = document.getElementById('dash'), board = document.getElementById('board');
  tb.replaceChildren(); dash.replaceChildren(); board.replaceChildren();
  if (!rows.length) {
    dash.append(h('div', {class:'msg'}, 'Aucune donnée. Associez les colonnes dans le panneau de configuration du widget, ou ajoutez des lignes à la table source.'));
    return;
  }
  const themes = uniq(rows.map(r => r.theme));
  if (!themes.includes(theme)) theme = themes[0] || '';
  const sousList = uniq(rows.filter(r => r.theme === theme).map(r => r.sousTheme));
  if (sous && !sousList.includes(sous) && !rows.some(r => r.theme === theme && r.sousTheme === sous)) sous = '';
  if (!sous) sous = sousList[0] || '';
  const withCur = sousList.includes(sous) ? sousList : [...sousList, sous].filter(Boolean);

  const selT = h('select', {'aria-label':'Thème', onchange: e => { theme = e.target.value; sous = ''; openId = null; closeDrawer(); render(); }},
    themes.map(t => { const o = h('option', {}, t); o.value = t; o.selected = t === theme; return o; }));
  const selS = h('select', {'aria-label':'Sous-thème', onchange: e => { sous = e.target.value; closeDrawer(); render(); }},
    withCur.map(t => { const o = h('option', {}, t); o.value = t; o.selected = t === sous; return o; }));
  tb.append(selT, selS,
    h('button', {onclick: () => toggleAdd(true)}, '+ Sous-thème'),
    h('span', {class:'sp'}),
    h('button', {class: mode5 ? 'on' : '', onclick: () => { mode5 = true; render(); }}, '5 blocs'),
    h('button', {class: mode5 ? '' : 'on', onclick: () => { mode5 = false; render(); }}, '3 blocs'));

  const cur = current(), st = stats(cur);

  // Rapport de force
  const all = [...POS, NI];
  const bar = h('div', {class:'bar', role:'img', 'aria-label':'Poids en population par position'},
    all.filter(p => st[p.k].pop > 0).map(p =>
      h('div', {class: 'seg' + (p === NI ? ' ni' : ''), style: `width:${st[p.k].pop}%;background:${p === NI ? '' : p.c}`, title: `${p.k} : ${st[p.k].n} États, ${fmt(st[p.k].pop)} %`},
        st[p.k].pop >= 4 ? fmt(st[p.k].pop) + ' %' : '')));
  const legend = h('div', {class:'legend'}, all.map(p =>
    h('span', {}, h('i', {style:`background:${p.c}`}), `${p.k} : ${st[p.k].n} (${fmt(st[p.k].pop)} %)`)));
  const camp = (label, keys, color) => {
    const n = keys.reduce((a, k) => a + st[k].n, 0), p = keys.reduce((a, k) => a + st[k].pop, 0);
    const [txt, cls] = statut(n, p);
    return h('div', {class:'camp', style:`border-left-color:${color}`},
      h('b', {}, label), `${n} États · ${fmt(p)} % de la population`, h('br'), h('span', {class:'tag ' + cls}, txt));
  };
  dash.append(h('div', {class:'dash'},
    h('b', {}, `${sous || 'Aucun sous-thème'} : rapport de force`), h('div', {style:'height:8px'}),
    bar, legend,
    h('div', {class:'camps'},
      camp('Moins ambitieux (avec « beaucoup moins »)', [POS[0].k, POS[1].k], POS[1].c),
      camp('Plus ambitieux (avec « beaucoup plus »)', [POS[3].k, POS[4].k], POS[3].c)),
    h('div', {class:'legend', style:'margin:8px 0 0'},
      `Minorité de blocage : ${SEUILS.blocageEtats} États et plus, ${SEUILS.blocagePop} % de la population et plus. Majorité qualifiée : ${SEUILS.qmEtats} États et plus, ${SEUILS.qmPop} % et plus.`)));

  // Colonnes
  const cols = mode5
    ? [...POS.map(p => ({label:p.k, keys:[p.k], drop:p.k, c:p.c})), {label:NI.k, keys:[NI.k], drop:'', c:NI.c}]
    : [{label:'Moins ambitieux', keys:[POS[0].k, POS[1].k], drop:POS[1].k, c:POS[1].c},
       {label:'Commission', keys:[POS[2].k], drop:POS[2].k, c:POS[2].c},
       {label:'Plus ambitieux', keys:[POS[3].k, POS[4].k], drop:POS[3].k, c:POS[3].c},
       {label:NI.k, keys:[NI.k], drop:'', c:NI.c}];
  cols.forEach(col => {
    const items = cur.filter(r => col.keys.includes(posKey(r))).sort((a, b) => pct(b) - pct(a));
    const n = items.length, p = items.reduce((a, r) => a + pct(r), 0);
    const el = h('div', {class:'col', style:`--c:${col.c}`},
      h('h3', {}, col.label, h('span', {}, `${n} · ${fmt(p)} %`)),
      items.map(r => h('div', {class:'card', draggable:'true', title:'Cliquer pour le détail, glisser pour changer de position',
        ondragstart: e => { e.dataTransfer.setData('text/plain', String(r.id)); e.dataTransfer.effectAllowed = 'move'; },
        onclick: () => { openId = r.id; renderDrawer(); }},
        h('span', {}, h('b', {}, r.code), ' ', r.etat,
          !mode5 && posKey(r).startsWith('Beaucoup') ? h('small', {}, ' · beaucoup') : null,
          (r.notes || r.source) ? h('span', {class:'n', title:'Notes ou source renseignées'}, ' ●') : null),
        h('small', {}, fmt(pct(r)) + ' %'))));
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); el.classList.remove('over');
      const id = Number(e.dataTransfer.getData('text/plain')), r = rows.find(x => x.id === id);
      if (!r || col.keys.includes(posKey(r))) return;
      save(id, {position: col.drop}); render();
    });
    board.append(el);
  });
  board.className = 'board';
}

// ---------- Fiche d’un pays ----------
function closeDrawer() { openId = null; document.getElementById('drawer').hidden = true; }
function renderDrawer() {
  const d = document.getElementById('drawer'), r = rows.find(x => x.id === openId);
  if (!r) { d.hidden = true; return; }
  d.hidden = false; d.replaceChildren();
  const selPos = h('select', {id:'fPos', onchange: e => { save(r.id, {position: e.target.value}); render(); }},
    [...POS, NI].map(p => { const o = h('option', {}, p.k); o.value = p === NI ? '' : p.k; o.selected = posKey(r) === p.k; return o; }));
  const notes = h('textarea', {id:'fNotes', onchange: e => save(r.id, {notes: e.target.value}).then(render)}); notes.value = r.notes || '';
  const src = h('input', {id:'fSrc', onchange: e => save(r.id, {source: e.target.value}).then(render)}); src.value = r.source || '';
  d.append(
    h('div', {class:'top'}, h('div', {}, h('h2', {}, `${r.etat} (${r.code})`), h('small', {style:'color:var(--mute)'}, `${r.theme} › ${r.sousTheme} · ${fmt(pct(r))} % de la population`)),
      h('button', {onclick: closeDrawer, 'aria-label':'Fermer'}, 'Fermer')),
    h('label', {for:'fPos'}, 'Position'), selPos,
    h('label', {for:'fNotes'}, 'Notes'), notes,
    h('label', {for:'fSrc'}, 'Source'), src);
}

// ---------- Ajout d’un sous-thème ----------
function toggleAdd(show) {
  const box = document.getElementById('addbox');
  box.hidden = !show;
  if (show) {
    document.getElementById('themeList').replaceChildren(...uniq(rows.map(r => r.theme)).map(t => { const o = document.createElement('option'); o.value = t; return o; }));
    document.getElementById('addTheme').value = theme;
    document.getElementById('addSous').value = '';
    document.getElementById('addMsg').textContent = '';
    document.getElementById('addSous').focus();
  }
}
document.getElementById('addCancel').onclick = () => toggleAdd(false);
document.getElementById('addOk').onclick = async () => {
  const t = document.getElementById('addTheme').value.trim(), s = document.getElementById('addSous').value.trim();
  const msg = document.getElementById('addMsg');
  if (!t || !s) { msg.textContent = 'Renseignez le thème et le sous-thème.'; return; }
  if (rows.some(r => r.theme === t && norm(r.sousTheme) === norm(s))) { msg.textContent = 'Ce sous-thème existe déjà pour ce thème.'; return; }
  const states = {};
  rows.forEach(r => { if (r.code && !(r.code in states)) states[r.code] = {code:r.code, etat:r.etat, poids:r.poids}; });
  const recs = Object.values(states).map(x => ({fields: grist.mapColumnNamesBack({...x, theme:t, sousTheme:s, position:''})}));
  if (!recs.length) { msg.textContent = 'Aucun État membre trouvé dans la table.'; return; }
  try {
    await grist.selectedTable.create(recs);
    theme = t; sous = s; toggleAdd(false); render();
  } catch (e) { msg.textContent = 'Échec de la création : ' + e.message; }
};
</script>
</body>
</html>
